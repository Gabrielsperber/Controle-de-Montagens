name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: install
        shell: bash
        run: set -o pipefail; npm install 2>&1 | tee /tmp/log-install.txt
        continue-on-error: true

      - name: Build web api bundle
        id: bundle
        if: steps.install.outcome == 'success'
        shell: bash
        run: set -o pipefail; npx esbuild src-mobile/api.js --bundle --format=iife --platform=browser --outfile=www/api.js 2>&1 | tee /tmp/log-bundle.txt
        continue-on-error: true

      - name: Sync Capacitor Android project
        id: sync
        if: steps.install.outcome == 'success'
        shell: bash
        run: set -o pipefail; npx cap sync android 2>&1 | tee /tmp/log-sync.txt
        continue-on-error: true

      - name: Setup JDK 17
        if: steps.sync.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        if: steps.sync.outcome == 'success'
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: gradlebuild
        if: steps.sync.outcome == 'success'
        working-directory: android
        shell: bash
        run: set -o pipefail; ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/log-gradle.txt
        continue-on-error: true

      - name: Rename APK
        if: steps.gradlebuild.outcome == 'success'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ControleDeMontagens-debug.apk

      - name: Create release with APK
        if: steps.gradlebuild.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "APK gerado automaticamente para teste."
          files: ControleDeMontagens-debug.apk

      - name: Publicar logs via API (sempre)
        if: always()
        shell: bash
        env:
          GH_TOKEN_API: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in /tmp/log-install.txt /tmp/log-bundle.txt /tmp/log-sync.txt /tmp/log-gradle.txt; do
            name=$(basename "$f")
            if [ -f "$f" ]; then
              existing_sha=$(curl -s -H "Authorization: token $GH_TOKEN_API" "https://api.github.com/repos/${{ github.repository }}/contents/debug-logs/$name" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch(e){console.log('')}})")
              node -e "
                const fs=require('fs');
                const content=fs.readFileSync('$f','utf-8');
                const payload={message:'debug logs run ${{ github.run_number }}', content: Buffer.from(content).toString('base64')};
                const sha='$existing_sha';
                if (sha) payload.sha = sha;
                fs.writeFileSync('/tmp/payload.json', JSON.stringify(payload));
              "
              curl -s -X PUT -H "Authorization: token $GH_TOKEN_API" -H "Content-Type: application/json" \
                "https://api.github.com/repos/${{ github.repository }}/contents/debug-logs/$name" \
                -d @/tmp/payload.json -o /tmp/put-response-$name.json
              echo "Publicado: debug-logs/$name"
            fi
          done

      - name: Falhar job se algo deu errado
        if: steps.install.outcome == 'failure' || steps.bundle.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.gradlebuild.outcome == 'failure'
        run: exit 1
