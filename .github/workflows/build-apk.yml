name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web api bundle
        run: npx esbuild src-mobile/api.js --bundle --format=iife --platform=browser --outfile=www/api.js

      - name: Sync Capacitor Android project
        id: sync
        shell: bash
        run: set -o pipefail; npx cap sync android 2>&1 | tee sync-log.txt
        continue-on-error: true

      - name: Setup JDK 17
        if: steps.sync.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        if: steps.sync.outcome == 'success'
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: gradlebuild
        if: steps.sync.outcome == 'success'
        working-directory: android
        shell: bash
        run: set -o pipefail; ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-log.txt
        continue-on-error: true

      - name: Publicar log de diagnóstico (se algo falhar)
        if: steps.sync.outcome == 'failure' || steps.gradlebuild.outcome == 'failure'
        run: |
          git config user.email "build@controledemontagens.local"
          git config user.name "Controle de Montagens Build"
          git checkout -B debug-log
          [ -f sync-log.txt ] && git add -f sync-log.txt || true
          [ -f gradle-log.txt ] && git add -f gradle-log.txt || true
          git commit -m "debug: logs (run ${{ github.run_number }})"
          git push -f origin debug-log
          exit 1

      - name: Rename APK
        if: steps.gradlebuild.outcome == 'success'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ControleDeMontagens-debug.apk

      - name: Create release with APK
        if: steps.gradlebuild.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "APK gerado automaticamente para teste. Instale direto no Android (pode ser necessário permitir 'fontes desconhecidas')."
          files: ControleDeMontagens-debug.apk

      - name: Falhar job se o build não deu certo
        if: steps.sync.outcome == 'failure' || steps.gradlebuild.outcome == 'failure'
        run: exit 1
